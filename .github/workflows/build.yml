name: Compiler l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature privée (si configurée)
        env:
          KS_B64: ${{ secrets.ECHEO_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.ECHEO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASSWORD" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/echeo-release.jks"
            echo "ECHEO_KEYSTORE_PATH=$RUNNER_TEMP/echeo-release.jks" >> "$GITHUB_ENV"
            echo "ECHEO_KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "Signature : clé privée"
          else
            echo "Signature : clé de développement du dépôt"
          fi

      - name: Secret de licence (obligatoire pour que l'app accepte des clés)
        env:
          LICENCE_SECRET: ${{ secrets.ECHEO_LICENCE_SECRET }}
        run: |
          if [ -n "$LICENCE_SECRET" ]; then
            echo "Licence : secret configuré"
          else
            echo "::warning::ECHEO_LICENCE_SECRET absent : cette version d'Echeo refusera toutes les clés. Ajouter le secret dans Settings > Secrets > Actions (valeur copiée depuis Forge Licence)."
          fi

      - name: Compiler l'APK
        env:
          ECHEO_LICENCE_SECRET: ${{ secrets.ECHEO_LICENCE_SECRET }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Echeo-0.1.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: echeo-apk
          path: out/*.apk

      - name: Captures d'écran (Paparazzi)
        run: ./gradlew --no-daemon recordPaparazziDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echeo-captures
          path: app/src/test/snapshots/images/*.png
          if-no-files-found: ignore

      # APK téléchargeable depuis la page « Releases » (aussi depuis le téléphone).
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" out/*.apk \
            --title "Echeo 0.1.${GITHUB_RUN_NUMBER}" \
            --notes "Compilation automatique de ${GITHUB_SHA::7}."

      # Dernier APK et dernières captures, sur la branche « builds ».
      - name: Publier sur la branche builds
        if: always()
        run: |
          mkdir -p pub
          cp out/*.apk pub/ 2>/dev/null || true
          cp app/src/test/snapshots/images/*.png pub/ 2>/dev/null || true
          cd pub
          git init -q -b builds
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Compilation ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" builds
